<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <style>
    @keyframes spinY {
      0% { transform: rotateY(0deg) rotateX(60deg); }
      100% { transform: rotateY(360deg) rotateX(60deg); }
    }
    @keyframes spinZ {
      0% { transform: rotateZ(0deg); }
      100% { transform: rotateZ(360deg); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .bg { fill: #0D1117; }
    .wireframe { fill: none; stroke: #00FF00; stroke-width: 0.5; opacity: 0.8; }
    .core { fill: none; stroke: #00FF00; stroke-width: 1.5; opacity: 0.9; }
    .glow { filter: drop-shadow(0 0 10px #00FF00); }
    .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; letter-spacing: 6px; text-anchor: middle; font-weight: 300; }
  </style>

  <rect class="bg" width="100%" height="100%" rx="8" />

  <!-- Elegant floating animation -->
  <g style="animation: float 8s ease-in-out infinite;">
    
    <g transform="translate(400, 110) scale(1.3)" class="glow">
      <!-- Outer abstract rings -->
      <g style="animation: spinZ 30s linear infinite; transform-origin: 0 0;">
        <circle cx="0" cy="0" r="50" class="wireframe" stroke-dasharray="1 4"/>
        <circle cx="0" cy="0" r="60" class="wireframe" stroke-dasharray="4 12"/>
      </g>

      <!-- Inner 3D gyroscope effect -->
      <g style="animation: spinY 15s linear infinite; transform-origin: 0 0;">
        <ellipse cx="0" cy="0" rx="40" ry="40" class="core"/>
        <ellipse cx="0" cy="0" rx="40" ry="15" class="core"/>
        <ellipse cx="0" cy="0" rx="15" ry="40" class="core"/>
        <line x1="-40" y1="0" x2="40" y2="0" class="wireframe"/>
        <line x1="0" y1="-40" x2="0" y2="40" class="wireframe"/>
      </g>
    </g>
  </g>

  <text x="400" y="215" class="text">ANTI-GRAVITY ENGINE STABILIZED</text>
  <text x="400" y="235" class="text" style="font-size: 9px; opacity: 0.5; letter-spacing: 2px;">SYS.CORE // NOMINAL</text>
</svg>
