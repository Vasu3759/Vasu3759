<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00FF00" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes drop1 {
      0% { transform: translateY(-60px); opacity: 1; }
      100% { transform: translateY(260px); opacity: 1; }
    }
    @keyframes drop2 {
      0% { transform: translateY(-100px); opacity: 1; }
      100% { transform: translateY(260px); opacity: 1; }
    }
    @keyframes drop3 {
      0% { transform: translateY(-150px); opacity: 1; }
      100% { transform: translateY(260px); opacity: 1; }
    }
    
    @keyframes explode {
      0% { r: 5; opacity: 1; fill: #FFA500; stroke: #FF0000; stroke-width: 2; }
      20% { r: 20; opacity: 1; fill: #FF4500; stroke: #FFFF00; stroke-width: 4; }
      50% { r: 150; opacity: 0.8; fill: #FF0000; stroke: transparent; }
      100% { r: 200; opacity: 0; fill: #8B0000; stroke: transparent; }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; color: #FF0000; }
    }

    .bg { fill: #0D1117; }
    
    .t-piece { fill: #9900FF; stroke: #fff; stroke-width: 1; filter: url(#glow); }
    .l-piece { fill: #FFA500; stroke: #fff; stroke-width: 1; filter: url(#glow); }
    .s-piece { fill: #00FF00; stroke: #fff; stroke-width: 1; filter: url(#glow); }
    .i-piece { fill: #00FFFF; stroke: #fff; stroke-width: 1; filter: url(#glow); }

    .drop-fast { animation: drop1 2.5s linear infinite; }
    .drop-med { animation: drop2 3.5s linear infinite; }
    .drop-slow { animation: drop3 4.5s linear infinite; }
    
    .delay-1 { animation-delay: 0.5s; }
    .delay-2 { animation-delay: 1.2s; }
    .delay-3 { animation-delay: 2.1s; }
    
    .bomb-text { font-family: 'Courier New', Courier, monospace; font-size: 28px; font-weight: bold; fill: #FF0000; text-anchor: middle; filter: url(#glow); animation: pulse 1s infinite; }
    .blast { animation: explode 2.5s ease-out infinite; transform-origin: center; }
  </style>

  <rect class="bg" width="100%" height="100%" rx="8" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="8" />

  <!-- Falling Tetris Pieces -->
  <g class="drop-fast">
    <g transform="translate(100, 0)">
      <rect class="i-piece" x="0" y="0" width="80" height="20" rx="2" />
    </g>
  </g>
  
  <g class="drop-med delay-1">
    <g transform="translate(250, 0)">
      <rect class="t-piece" x="20" y="0" width="60" height="20" rx="2" />
      <rect class="t-piece" x="40" y="20" width="20" height="20" rx="2" />
    </g>
  </g>

  <g class="drop-slow delay-2">
    <g transform="translate(600, 0)">
      <rect class="l-piece" x="0" y="0" width="20" height="60" rx="2" />
      <rect class="l-piece" x="20" y="40" width="40" height="20" rx="2" />
    </g>
  </g>

  <g class="drop-fast delay-3">
    <g transform="translate(700, 0)">
      <rect class="s-piece" x="20" y="0" width="40" height="20" rx="2" />
      <rect class="s-piece" x="0" y="20" width="40" height="20" rx="2" />
    </g>
  </g>

  <!-- Central Bomb Blast -->
  <g transform="translate(400, 125)">
    <!-- Shockwaves -->
    <circle class="blast" cx="0" cy="0" r="0" />
    <circle class="blast" cx="0" cy="0" r="0" style="animation-delay: 0.2s;" />
    <circle class="blast" cx="0" cy="0" r="0" style="animation-delay: 0.4s;" />
    
    <!-- Core Box -->
    <rect x="-140" y="-30" width="280" height="60" fill="#111" stroke="#FF0000" stroke-width="2" rx="5" filter="url(#glow)"/>
    <text class="bomb-text" y="10">KABOOM!</text>
  </g>
</svg>
