<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150">
  <style>
    @keyframes march {
      0% { transform: translateX(0); }
      100% { transform: translateX(600px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { fill: #00FF00; }
      50% { fill: #ffffff; }
    }
    .invader { animation: march 15s linear infinite alternate; fill: #00FF00; }
    .laser { animation: pulse 1s infinite; }
    .bg { fill: #0D1117; }
    .pixel { width: 8px; height: 8px; }
  </style>

  <rect class="bg" width="100%" height="100%" rx="8" />
  <rect x="10" y="10" width="780" height="130" fill="none" stroke="#00FF00" stroke-width="2" stroke-dasharray="10 5" opacity="0.5"/>
  
  <text x="30" y="40" font-family="monospace" font-size="18" fill="#00FF00" font-weight="bold">> _SYS_DEFENSE_ACTIVE <tspan style="animation: blink 1s infinite;">█</tspan></text>

  <!-- Player Ship (Retro Pixel Art) -->
  <g transform="translate(380, 100)" fill="#00FF00">
    <rect x="16" y="0" class="pixel"/>
    <rect x="8" y="8" width="24" height="8" />
    <rect x="0" y="16" width="40" height="16" />
    <!-- laser -->
    <rect x="16" y="-80" width="8" height="20" class="laser"/>
  </g>

  <!-- Animated Space Invader Alien -->
  <g class="invader" transform="translate(30, 40)">
    <!-- Row 1 -->
    <rect x="16" y="0" class="pixel"/><rect x="64" y="0" class="pixel"/>
    <!-- Row 2 -->
    <rect x="24" y="8" class="pixel"/><rect x="56" y="8" class="pixel"/>
    <!-- Row 3 -->
    <rect x="16" y="16" class="pixel"/><rect x="24" y="16" class="pixel"/><rect x="32" y="16" class="pixel"/><rect x="40" y="16" class="pixel"/><rect x="48" y="16" class="pixel"/><rect x="56" y="16" class="pixel"/><rect x="64" y="16" class="pixel"/>
    <!-- Row 4 -->
    <rect x="0" y="24" class="pixel"/><rect x="8" y="24" class="pixel"/><rect x="24" y="24" class="pixel"/><rect x="32" y="24" class="pixel"/><rect x="40" y="24" class="pixel"/><rect x="56" y="24" class="pixel"/><rect x="72" y="24" class="pixel"/><rect x="80" y="24" class="pixel"/>
    <!-- Row 5 -->
    <rect x="0" y="32" class="pixel"/><rect x="8" y="32" class="pixel"/><rect x="16" y="32" class="pixel"/><rect x="24" y="32" class="pixel"/><rect x="32" y="32" class="pixel"/><rect x="40" y="32" class="pixel"/><rect x="48" y="32" class="pixel"/><rect x="56" y="32" class="pixel"/><rect x="64" y="32" class="pixel"/><rect x="72" y="32" class="pixel"/><rect x="80" y="32" class="pixel"/>
    <!-- Row 6 -->
    <rect x="0" y="40" class="pixel"/><rect x="16" y="40" class="pixel"/><rect x="64" y="40" class="pixel"/><rect x="80" y="40" class="pixel"/>
    <!-- Row 7 -->
    <rect x="24" y="48" class="pixel"/><rect x="32" y="48" class="pixel"/><rect x="48" y="48" class="pixel"/><rect x="56" y="48" class="pixel"/>
  </g>
</svg>
